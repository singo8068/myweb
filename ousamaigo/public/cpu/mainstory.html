<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>おうさまいご</title>

  <link rel="stylesheet" href="../css/style.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: #000;
      overflow: hidden;
    }


    /* =========================
       ワールドマップ全体
       ========================= */

    .world-map {
      position: relative;

      width: 100vw;
      height: 100vh;

      margin: 0;
      padding: 0;

      background-image: url("pic/world.jpg");
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;

      overflow: hidden;
    }


    /* =========================
       タイトル
       ========================= */

    .world-title {
      position: absolute;

      top: 3%;
      left: 50%;

      transform: translateX(-50%);

      margin: 0;
      padding: 10px 30px;

      background: rgba(255, 255, 255, 0.92);

      border: 3px solid #8b6b35;
      border-radius: 18px;

      color: #4b3518;

      font-size: clamp(22px, 4vw, 34px);
      font-weight: bold;

      white-space: nowrap;

      box-shadow:
        0 4px 8px rgba(0, 0, 0, 0.35);

      z-index: 10;
    }


    /* =========================
       マップ上のボタン
       ========================= */

    .map-button {
      position: absolute;

      transform: translate(-50%, -50%);

      display: block;

      margin: 0;
      padding: 15px 32px;

      min-width: 180px;

      background: linear-gradient(
        to bottom,
        #ffe28a 0%,
        #e7ad35 48%,
        #c88718 100%
      );

      color: #4b3008;

      text-decoration: none;
      text-align: center;

      font-weight: bold;
      font-size: clamp(17px, 2.8vw, 26px);

      border: 4px solid #fff3bd;
      border-radius: 18px;

      box-shadow:
        0 5px 0 #8a5b12,
        0 8px 12px rgba(0, 0, 0, 0.4);

      white-space: nowrap;

      z-index: 5;

      transition:
        transform 0.15s,
        filter 0.15s;
    }

    .map-button:hover {
      filter: brightness(1.08);

      transform:
        translate(-50%, -50%)
        scale(1.05);
    }

    .map-button:active {
      transform:
        translate(-50%, calc(-50% + 4px));
      
      box-shadow:
        0 2px 0 #8a5b12,
        0 4px 7px rgba(0, 0, 0, 0.35);
    }


    /* =========================
       未開放ボタン
       ========================= */

    .map-locked {
      position: absolute;

      transform: translate(-50%, -50%);

      display: block;

      padding: 15px 32px;

      min-width: 180px;

      background: linear-gradient(
        to bottom,
        #bdbdbd 0%,
        #858585 50%,
        #626262 100%
      );

      color: white;

      text-align: center;

      font-weight: bold;
      font-size: clamp(17px, 2.8vw, 26px);

      border: 4px solid #eeeeee;
      border-radius: 18px;

      box-shadow:
        0 5px 0 #414141,
        0 8px 12px rgba(0, 0, 0, 0.4);

      white-space: nowrap;

      z-index: 5;
    }


    /* =========================
       メニューにもどる
       ========================= */

    .back-button {
      position: absolute;

      top: 2%;
      left: 2%;

      display: block;

      padding: 12px 24px;

      background: linear-gradient(
        to bottom,
        #ffffff 0%,
        #e8e8e8 50%,
        #c8c8c8 100%
      );

      color: #333;

      text-decoration: none;

      font-size: clamp(15px, 2.2vw, 22px);
      font-weight: bold;

      border: 3px solid white;
      border-radius: 15px;

      box-shadow:
        0 4px 0 #777,
        0 6px 10px rgba(0, 0, 0, 0.35);

      z-index: 20;

      transition:
        transform 0.15s,
        filter 0.15s;
    }

    .back-button:hover {
      filter: brightness(1.05);

      transform: scale(1.05);
    }

    .back-button:active {
      transform: translateY(3px);

      box-shadow:
        0 1px 0 #777,
        0 3px 6px rgba(0, 0, 0, 0.3);
    }


    /* =========================
       ボタン位置
       ========================= */

    /* 草原 */
    #rokuroButton {
      left: 27%;
      top: 68%;
    }


    /* 町 */
    #nanaroArea {
      position: absolute;

      left: 77%;
      top: 27%;
    }


    /* 山 */
    #kyuroArea {
      position: absolute;

      left: 28%;
      top: 25%;
    }


    /* 海 */
    #juitiArea {
      position: absolute;

      left: 77%;
      top: 76%;
    }

  </style>
</head>


<body>

<div class="world-map">


  <!-- メニューにもどる -->
  <a
    href="../index.html"
    class="back-button"
  >
    メニューにもどる
  </a>


  <!-- タイトル -->
  <h2 class="world-title">
    ストーリーモード
  </h2>


  <!-- ろくろそうげん -->
  <a
    id="rokuroButton"
    class="map-button"
    href="rokuro.html"
  >
    ろくろそうげん
  </a>


  <!-- ななろのまち -->
  <div id="nanaroArea"></div>


  <!-- きゅうろやま -->
  <div id="kyuroArea"></div>


  <!-- じゅういちろのうみ -->
  <div id="juitiArea"></div>


</div>


<script>


  // =========================
  // ななろのまち
  // =========================

  const usiWins =
    Number(localStorage.getItem("win_うし")) || 0;

  if (usiWins >= 1) {

    document.getElementById("nanaroArea").innerHTML = `
      <a
        class="map-button"
        href="nanaro.html"
      >
        ななろのまち
      </a>
    `;

  } else {

    document.getElementById("nanaroArea").innerHTML = `
      <span class="map-locked">
        ？？？
      </span>
    `;

  }


  // =========================
  // きゅうろやま
  // =========================

  const inuWins =
    Number(localStorage.getItem("win_いぬ")) || 0;

  if (inuWins >= 1) {

    document.getElementById("kyuroArea").innerHTML = `
      <a
        class="map-button"
        href="kyuro.html"
      >
        きゅうろやま
      </a>
    `;

  } else {

    document.getElementById("kyuroArea").innerHTML = `
      <span class="map-locked">
        ？？？
      </span>
    `;

  }


  // =========================
  // じゅういちろのうみ
  // =========================

  const saruWins =
    Number(localStorage.getItem("win_さる")) || 0;

  if (saruWins >= 1) {

    document.getElementById("juitiArea").innerHTML = `
      <a
        class="map-button"
        href="juiti.html"
      >
        じゅういちろのうみ
      </a>
    `;

  } else {

    document.getElementById("juitiArea").innerHTML = `
      <span class="map-locked">
        ？？？
      </span>
    `;

  }


</script>

</body>
</html>
