<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>おうさまいご</title>

<link rel="stylesheet" href="../css/style.css">
<style>
a { display: inline-block; width: auto; margin: 30px auto 0; padding: 10px 40px; background-color: #4CAF50; color: white; text-decoration: none; border-radius: 12px; transition: background-color 0.3s; }
.animal-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
 font-size: 40px;
  padding: 8px 10px;
}
.animal-button img {
    width: 80px;
    height: 80px;
    object-fit: contain;
}
body {
    background-image: url("pic/mati.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}
</style>
</head>
<body>



<div class="section">
  <a href="mainstory.html" class="back">マップにもどる</a>
</div>

<h2>ななろのまち</h2>

<!-- ねずみ -->
<a href="talk.html?character=ねずみ" class="animal-button">
    <img src="pic/nezumi.webp">
    <span>ねずみ<br/><span id="nezumiWins">0</span> かち</span>
</a>

<br/>
<br/>

<!-- 次の動物 -->
<div id="2ani">
    <a href="">
        <span>？？？</span>
    </a>
</div>

<br/>
<div id="3ani">
    <a href="">
        <span>？？？</span>
    </a>
</div>

<br/>
<div id="4ani">
    <a href="">
        <span>？？？</span>
    </a>
</div>

<script>
const nezumiWins = Number(localStorage.getItem("win_ねずみ")) || 0;
const karasuWins = Number(localStorage.getItem("win_からす")) || 0;
const inuWins = Number(localStorage.getItem("win_いぬ")) || 0;
const hitoWins = Number(localStorage.getItem("win_ひと")) || 0;
document.getElementById("nezumiWins").textContent = nezumiWins;

// ねずみに1勝以上していたら羊を表示
if (nezumiWins >= 1) {
    document.getElementById("2ani").innerHTML = `
        <a href="talk.html?character=からす" class="animal-button">
            <img src="pic/karasu.webp">
            <span>からす<br/><span id="karasuWins">0</span> かち</span>
        </a>
    `;
    // からすの勝利数を取得
    document.getElementById("karasuWins").textContent = karasuWins;
}
// からすに1勝以上していたら犬を表示
if (karasuWins >= 1) {
    document.getElementById("3ani").innerHTML = `
        <a href="talk.html?character=いぬ" class="animal-button">
            <img src="pic/inu.webp">
            <span>いぬ<br/><span id="inuWins">0</span> かち</span>
        </a>
    `;
     // いぬの勝利数を取得
    document.getElementById("inuWins").textContent = inuWins;
}
// いぬに1勝以上していたら犬を表示
if (inuWins >= 1) {
    document.getElementById("4ani").innerHTML = `
        <a href="talk.html?character=ひと" class="animal-button">
            <img src="pic/hito.webp">
            <span>ひと<br/><span id="hitoWins">0</span> かち</span>
        </a>
    `;
     // ひとの勝利数を取得
    document.getElementById("hitoWins").textContent = hitoWins;
}

</script>



</body>
</html>
