
<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">

<title>統計 - おうさまいご</title>

<link rel="stylesheet" href="css/style.css">

<style>

body {
    font-family: sans-serif;
    text-align: center;
}

#toukeiBox {
    width: 600px;
    max-width: 95%;
    margin: 30px auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    background: white;
}

th,
td {
    border: 1px solid #999;
    padding: 10px 5px;
}

th {
    background: #eee;
}

.date {
    width: 60%;
}

.wins {
    width: 40%;
}

#loading {
    margin: 30px;
}

#error {
    color: red;
    margin: 20px;
}

#backMenu {
    display: inline-block;
    margin-top: 20px;
}

</style>

</head>

<body>

<a id="backMenu" href="mainstory.html">マップにもどる</a>

<h2>📊 おうさまいご CPU統計</h2>

<div id="toukeiBox">

<div id="loading">
    統計を読み込んでいます……
</div>

<div id="error" style="display:none;"></div>

<table id="toukeiTable" style="display:none;">

    <thead>

        <tr>
            <th class="date">日付</th>
            <th class="wins">CPU勝利数</th>
        </tr>

    </thead>

    <tbody id="toukeiBody">
    </tbody>

</table>

</div>


<script>

async function loadToukei() {

    try {

        const response = await fetch(
            "https://myweb-qcr3.onrender.com/api/cpu-statsd"
        );

        if (!response.ok) {
            throw new Error("統計取得失敗");
        }

        const data = await response.json();

        console.log("CPU統計:", data);


        const tbody =
            document.getElementById("toukeiBody");

        tbody.innerHTML = "";


        data.forEach((item) => {

            const tr =
                document.createElement("tr");


            const dateTd =
                document.createElement("td");

            const winsTd =
                document.createElement("td");


// 日付
const parts = String(item.day).split("-");

dateTd.textContent =
    parts[0] + "/" +
    Number(parts[1]) + "/" +
    Number(parts[2]);


            // CPU勝利数
            winsTd.textContent =
                Number(item.wins).toLocaleString() +
                "勝";


            tr.appendChild(dateTd);
            tr.appendChild(winsTd);

            tbody.appendChild(tr);

        });


        document.getElementById("loading")
            .style.display = "none";

        document.getElementById("toukeiTable")
            .style.display = "table";


    } catch (error) {

        console.error(error);


        document.getElementById("loading")
            .style.display = "none";


        const errorBox =
            document.getElementById("error");


        errorBox.textContent =
            "統計を取得できませんでした。";


        errorBox.style.display = "block";

    }

}


loadToukei();

</script>

</body>
</html>
