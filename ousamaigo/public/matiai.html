

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>まちあいしつ</title>

<link rel="stylesheet" href="css/style.css">
<style>

body{
    font-family:sans-serif;
    text-align:center;
}

#rooms{
    width:800px;
    margin:auto;
}
.room-info {
    white-space: nowrap;
}
.room{
    border:2px solid black;
    border-radius:10px;
    margin:10px;
    padding:10px;
}

.room-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    box-sizing: border-box;
}

.room-info {
    min-width: 0;
    flex: 1;
}

.room-button {
    flex-shrink: 0;
}

.waiting {
    white-space: nowrap;
}
input,select{
    font-size:20px;
}

    button:hover {
      background-color: #45a049;
    }
    button {
      display: inline-block;
      margin-top: 0px;
      padding: 0px 10px;
      background-color: #4CAF50;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size:24px;
    }

</style>

</head>

<body>
<div class="section">
  <a href="index.html" class="back">メニューにもどる</a>
</div>
<h2>まちあいしつ</h2>
<div id="authButtons"> <button id="loginBtn" onclick="location.href='login.html'">ログイン</button> <button id="registerBtn" onclick="location.href='register.html'">会員登録</button> <button id="logoutBtn" onclick="logout()" style="display:none;">ログアウト</button> <a href="shop.html" class="back">ショップ</a> </div>

<div id="userStatus"></div>

<div>

<button id="createBtn" onclick="createRoom()">ぼしゅうする</button>
<button id="cancelBtn" onclick="cancelRoom()" disabled>ぼしゅうをやめる</button>
</div>
<p id="status"></p>
<hr>
<div id="rooms"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();
const roomsDiv=document.getElementById("rooms");
let waiting = false;
let currentUser = null;
let myLevel = 0;


// ==============================
// ユーザー情報
// ==============================

async function loadUserInfo() { try { const response = await fetch("/api/me"); // ログインしていない if (!response.ok) { myLevel = 0; document.getElementById("userStatus").textContent = "ゲスト"; // ログイン・会員登録を表示 document.getElementById("loginBtn").style.display = "inline-block"; document.getElementById("registerBtn").style.display = "inline-block"; // ログアウトを非表示 document.getElementById("logoutBtn").style.display = "none"; return; } // ログインしている場合 const data = await response.json(); if (!data.success) { throw new Error("ユーザー情報を取得できませんでした"); } const user = data.user; currentUser = user; myLevel = user.level; // ログイン・会員登録を非表示 document.getElementById("loginBtn").style.display = "none"; document.getElementById("registerBtn").style.display = "none"; // ログアウトを表示 document.getElementById("logoutBtn").style.display = "inline-block"; // Neonから取得した情報を表示 document.getElementById("userStatus").innerHTML = `${user.userId}　レベル ${user.level}　かちこし ${user.winDiff}　　 <span class="itemInfo"> <img src="/bin/gyem.webp"> ${user.gems} <img src="/bin/kiname.webp"> ${user.goldenCandy} <img src="/bin/mahoame.webp"> ${user.magicalCandy} <img src="/bin/amekakera.webp"> ${user.candyFragments} </span>`; console.log("ログインユーザー:", user); } catch (error) { console.error("ユーザー情報取得エラー:", error); document.getElementById("userStatus").textContent = "ユーザー情報を取得できませんでした"; } }

async function logout() {

    try {

        await fetch("/api/logout", {
            method: "POST"
        });

        location.reload();

    } catch (error) {

        console.error("ログアウトエラー:", error);

    }
}

// ページを開いたらユーザー情報を取得
loadUserInfo();

function createRoom(){

    if(waiting) return;

    waiting = true;

    document.getElementById("status").textContent = "ぼしゅうちゅうです…";

    document.getElementById("createBtn").disabled = true;
    document.getElementById("cancelBtn").disabled = false;

    socket.emit("createRoom", {
        name: currentUser ? currentUser.userId : "ゲスト",
        level: currentUser ? currentUser.level : myLevel
    });
}

function joinRoom(id){
    socket.emit("joinRoom", {
        id: id,
        level: myLevel
});
}

socket.on("startGame", room => {

    waiting = false;

    document.getElementById("status").textContent = "";

    document.getElementById("createBtn").disabled = false;
    document.getElementById("cancelBtn").disabled = true;

    location.href =
        `hutari.html?size=${room.size}` +
        `&room=${room.roomId}` +
        `&color=${room.color}` +
        `&maji=true` +
        `&mylv=${room.mylv}` +
        `&enlv=${room.enlv}`;

});

socket.on("roomList", rooms => {

    roomsDiv.innerHTML = "";

    if (rooms.length === 0) {
        roomsDiv.innerHTML = "<p>ぼしゅうちゅうのひとはいません。</p>";
        return;
    }

    rooms.forEach(room => {

        const div = document.createElement("div");
        div.className = "room";

        let buttonHtml;

        if (room.hostId === socket.id) {
            buttonHtml = "<b class=\"waiting\">ぼしゅうちゅう…</b>";
        } else {
            buttonHtml = `<button onclick="joinRoom('${room.roomId}')">さんか</button>`;
        }

        let roomInfo;

        if (room.hostMember) {
            roomInfo = `
                ${room.name}：
                レベル ${room.level}
            `;
        } else {
            roomInfo = `
                ${room.name}
            `;
        }

        div.innerHTML = `
            <div class="room-content">
                <span class="room-info">
                    ${roomInfo}
                </span>
                <span class="room-button">
                    ${buttonHtml}
                </span>
            </div>
        `;

        roomsDiv.appendChild(div);
    });

});
function cancelRoom(){

    if(!waiting) return;

    waiting = false;

    document.getElementById("status").textContent = "";

    document.getElementById("createBtn").disabled = false;
    document.getElementById("cancelBtn").disabled = true;

    socket.emit("cancelRoom");
}

</script>

</body>
</html>
