

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>まちあいしつ</title>

<link rel="stylesheet" href="css/style.css">
<style>

body{
    font-family:sans-serif;
    text-align:center;
}

#rooms{
    width:400px;
    margin:auto;
}

.room{
    border:2px solid black;
    border-radius:10px;
    margin:10px;
    padding:10px;
}

input,select{
    font-size:20px;
}

    button:hover {
      background-color: #45a049;
    }
    button {
      display: inline-block;
      margin-top: 0px;
      padding: 0px 10px;
      background-color: #4CAF50;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size:24px;
    }

</style>

</head>

<body>
<div class="section">
  <a href="index.html" class="back">メニューにもどる</a>
</div>
<h2>まちあいしつ</h2>

<div id="userStatus"></div>
<div>

おおきさ

<select id="size">
<option value="9">９×９</option>
</select>
<button id="createBtn" onclick="createRoom()">ぼしゅうする</button>
<button id="cancelBtn" onclick="cancelRoom()" disabled>ぼしゅうをやめる</button>
</div>
<p id="status"></p>
<hr>
<div id="rooms"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();
const roomsDiv=document.getElementById("rooms");
let waiting = false;

// ==============================
// ゲスト情報（Cookie）
// ==============================

function getCookie(name) {
    const cookies = document.cookie.split("; ");

    for (const cookie of cookies) {
        const [key, value] = cookie.split("=");

        if (key === name) {
            return decodeURIComponent(value);
        }
    }

    return null;
}


// Cookieからレベルを読み込む
let level = getCookie("level");
let winDiff = getCookie("winDiff");


// Cookieがなければ初期値を作成
if (level === null) {
    level = 1;
    document.cookie = "level=1; max-age=31536000; path=/";
}

if (winDiff === null) {
    winDiff = 0;
    document.cookie = "winDiff=0; max-age=31536000; path=/";
}


level = Number(level);
winDiff = Number(winDiff);



// 表示
document.getElementById("userStatus").textContent =
    `ゲスト　レベル ${level}　かちこし ${winDiff}`;

function createRoom(){

    if(waiting) return;

    waiting = true;

    document.getElementById("status").textContent = "ぼしゅうちゅうです…";

    document.getElementById("createBtn").disabled = true;
    document.getElementById("cancelBtn").disabled = false;

    socket.emit("createRoom",{
        name:"ゲスト",
        size:Number(document.getElementById("size").value)
    });
}

function joinRoom(id){
    socket.emit("joinRoom",id);
}

socket.on("startGame", room => {

    waiting = false;

    document.getElementById("status").textContent = "";

    document.getElementById("createBtn").disabled = false;
    document.getElementById("cancelBtn").disabled = true;

    location.href =
`hutari.html?size=${room.size}&room=${room.roomId}&color=${room.color}&maji=true`;

});

socket.on("roomList", rooms => {

    roomsDiv.innerHTML = "";

    if (rooms.length === 0) {
        roomsDiv.innerHTML = "<p>ぼしゅうちゅうのひとはいません。</p>";
        return;
    }

    rooms.forEach(room => {

        const div = document.createElement("div");
        div.className = "room";

        let buttonHtml;

        if (room.hostId === socket.id) {
            buttonHtml = "<b>ぼしゅうちゅう…</b>";
        } else {
            buttonHtml = `<button onclick="joinRoom('${room.roomId}')">さんか</button>`;
        }

        div.innerHTML = `
            <div>
                ${room.name}：
                ${room.size}×${room.size}
                ${buttonHtml}
            </div>
        `;

        roomsDiv.appendChild(div);

    });

});
function cancelRoom(){

    if(!waiting) return;

    waiting = false;

    document.getElementById("status").textContent = "";

    document.getElementById("createBtn").disabled = false;
    document.getElementById("cancelBtn").disabled = true;

    socket.emit("cancelRoom");
}
</script>

</body>
</html>
