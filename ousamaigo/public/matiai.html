

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>まちあいしつ</title>

<link rel="stylesheet" href="css/style.css">
<style>

body{
    font-family:sans-serif;
    text-align:center;
}

#rooms{
    width:400px;
    margin:auto;
}

.room{
    border:2px solid black;
    border-radius:10px;
    margin:10px;
    padding:10px;
}

input,select{
    font-size:20px;
}

    button:hover {
      background-color: #45a049;
    }
    button {
      display: inline-block;
      margin-top: 0px;
      padding: 0px 10px;
      background-color: #4CAF50;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size:24px;
    }

</style>

</head>

<body>
<div class="section">
  <a href="index.html" class="back">メニューにもどる</a>
</div>
<h2>まちあいしつ</h2>

<div>

おおきさ

<select id="size">
<option value="6">６×６</option>
<option value="9">９×９</option>
<option value="11">１１×１１</option>
</select>
<button id="createBtn" onclick="createRoom()">ぼしゅうする</button>
</div>
<p id="status"></p>
<hr>
<div id="rooms"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();
const roomsDiv=document.getElementById("rooms");
let waiting = false;

function createRoom(){

    if(waiting) return;

    waiting = true;

    document.getElementById("status").textContent =
        "ぼしゅうちゅうです…";

    document.getElementById("createBtn").disabled = true;

    socket.emit("createRoom",{

        name:"ゲスト",

        size:Number(document.getElementById("size").value)

    });

}

function joinRoom(id){
    socket.emit("joinRoom",id);
}

socket.on("startGame",room=>{

    waiting = false;

    document.getElementById("status").textContent="";

    document.getElementById("createBtn").disabled=false;

location.href =
`hutari.html?size=${room.size}&room=${room.roomId}&color=${room.color}`;

});

socket.on("roomList", rooms => {

    roomsDiv.innerHTML = "";

    if (rooms.length === 0) {
        roomsDiv.innerHTML = "<p>ぼしゅうちゅうのひとはいません。</p>";
        return;
    }

    rooms.forEach(room => {

        const div = document.createElement("div");
        div.className = "room";

        let buttonHtml;

        if (room.hostId === socket.id) {
            buttonHtml = "<b>ぼしゅうちゅう…</b>";
        } else {
            buttonHtml = `<button onclick="joinRoom('${room.roomId}')">さんか</button>`;
        }

        div.innerHTML = `
            <div>
                ${room.name}：
                ${room.size}×${room.size}
                ${buttonHtml}
            </div>
        `;

        roomsDiv.appendChild(div);

    });

});
</script>

</body>
</html>
