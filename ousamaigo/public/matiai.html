<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>まちあいしつ</title>

<link rel="stylesheet" href="css/style.css">
<style>

body{
    font-family:sans-serif;
    text-align:center;
}

#createBtn,
#autoMatchBtn,
#cancelBtn,
#loginBtn,
#registerBtn,
#logoutBtn {
    cursor: pointer;
    height: 45px;
    font-size: 25px;
}

#rooms{
    width:800px;
    margin:auto;
}

.room-info {
    white-space: nowrap;
}

.room{
    border:2px solid black;
    border-radius:10px;
    margin:10px;
    padding:10px;
}

.room-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    box-sizing: border-box;
}

.room-info {
    min-width: 0;
    flex: 1;
}

.room-button {
    flex-shrink: 0;
}

.waiting {
    white-space: nowrap;
}

input,select{
    font-size:20px;
}

button:hover {
    background-color: #45a049;
}

button {
    display: inline-block;
    margin-top: 0px;
    padding: 0px 10px;
    background-color: #4CAF50;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-size:24px;
}

</style>

</head>

<body>

<div class="section">
  <a href="index.html" class="back" onclick="cancelRoom()">メニューにもどる</a>
</div>

<h2>まちあいしつ</h2>

<div id="authButtons">

    <button id="loginBtn"
            onclick="location.href='login.html'">
        ログイン
    </button>

    <button id="registerBtn"
            onclick="location.href='register.html'">
        かいいんとうろく
    </button>

    <button id="logoutBtn"
            onclick="logout()"
            style="display:none;">
        ログアウト
    </button>

    <a href="ranking.html">ランキング</a>

<!-- LINE認証していない会員だけ表示 -->
<a id="lineAuthLink"
   href="line.html"
   style="display:none;">
    LINEにんしょう
</a>

<!-- LINE認証済み・紹介者未登録の会員だけ表示 -->
<a id="lineFriendLink"
   href="linefriend.html"
   style="display:none;">
    しょうかいとうろく
</a>

    <a href="shop.html">ショップ</a>

</div>

<div id="userStatus"></div>

<div>

<button id="createBtn"
        onclick="createRoom()">
    ぼしゅうする
</button>

<select id="memberOnlySelect"
        style="display:none; width:160px; height:32px; font-size:16px;">

    <option value="false">
        だれでもさんかOK
    </option>

    <option value="true">
        かいいんのみ
    </option>

</select>

<button
    id="autoMatchBtn"
    onclick="location.href='automatch.html'"
    style="display:none;">
    じどうマッチング
</button>

<button id="cancelBtn"
        onclick="cancelRoom()"
        disabled>
    ぼしゅうをやめる
</button>

</div>

<p id="status"></p>

<hr>

<div id="rooms"></div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();
const matchSound = new Audio("sounds/match.mp3");
const roomsDiv =
    document.getElementById("rooms");

let waiting = false;

let currentUser = null;

let myLevel = 0;


// ==============================
// ユーザー情報
// ==============================

async function loadUserInfo() {

    try {

        console.log("ユーザー情報取得開始");

        const response =
            await fetch("/api/me");

        console.log(
            "/api/me status:",
            response.status
        );


        // ==============================
        // ログインしていない
        // ==============================

        if (!response.ok) {

            myLevel = 0;
            currentUser = null;

            document.getElementById(
                "userStatus"
            ).textContent = "ゲスト";


            document.getElementById(
                "loginBtn"
            ).style.display = "inline-block";

            document.getElementById(
                "registerBtn"
            ).style.display = "inline-block";

            document.getElementById(
                "logoutBtn"
            ).style.display = "none";

// LINE認証リンクは非表示
document.getElementById(
    "lineAuthLink"
).style.display = "none";

// 紹介者登録リンクも非表示
document.getElementById(
    "lineFriendLink"
).style.display = "none";


            console.log(
                "ゲストとして認識"
            );

            return;
        }


        const data =
            await response.json();

        console.log(
            "/api/me response:",
            data
        );


        if (!data.success) {
            throw new Error(
                "ユーザー情報を取得できませんでした"
            );
        }


        const user = data.user;

        currentUser = user;

        myLevel = user.level;


        document.getElementById(
            "memberOnlySelect"
        ).style.display = "inline-block";

        document.getElementById(
            "autoMatchBtn"
        ).style.display = "inline-block";


        document.getElementById(
            "loginBtn"
        ).style.display = "none";

        document.getElementById(
            "registerBtn"
        ).style.display = "none";

        document.getElementById(
            "logoutBtn"
        ).style.display = "inline-block";


       // ==============================
// LINE認証・紹介者登録
// ==============================

const lineAuthLink =
    document.getElementById(
        "lineAuthLink"
    );

const lineFriendLink =
    document.getElementById(
        "lineFriendLink"
    );


// --------------------------------
// LINE認証していない場合
// --------------------------------

if (!user.lineId) {

    // LINE認証を表示
    lineAuthLink.style.display =
        "inline-block";

    // 紹介者登録は非表示
    lineFriendLink.style.display =
        "none";

}


// --------------------------------
// LINE認証済みの場合
// --------------------------------

else {

    // LINE認証は非表示
    lineAuthLink.style.display =
        "none";


    // --------------------------------
    // 紹介者登録済みか確認
    // --------------------------------

    if (!user.referredBy) {

        // まだ紹介者が登録されていない
        lineFriendLink.style.display =
            "inline-block";

    } else {

        // すでに紹介者登録済み
        lineFriendLink.style.display =
            "none";

    }

}


        document.getElementById(
            "userStatus"
        ).innerHTML =
            `${user.userId}　レベル ${user.level}　かちこし ${user.winDiff}　　 
            <span class="itemInfo">
                <img src="/bin/gyem.webp"> ${user.gems}
                <img src="/bin/kiname.webp"> ${user.goldenCandy}
                <img src="/bin/mahoame.webp"> ${user.magicalCandy}
            </span>`;


        console.log(
            "ログインユーザー:",
            user
        );

    } catch (error) {

        console.error(
            "ユーザー情報取得エラー:",
            error
        );

        document.getElementById(
            "userStatus"
        ).textContent =
            "ユーザー情報を取得できませんでした";
    }
}


async function logout() {

    try {

        await fetch(
            "/api/logout",
            {
                method: "POST"
            }
        );

        location.reload();

    } catch (error) {

        console.error(
            "ログアウトエラー:",
            error
        );

    }
}


// ページを開いたらユーザー情報を取得
loadUserInfo();


function createRoom(){

    console.log(
        "ぼしゅうするボタンを押しました"
    );


    if(waiting) {

        console.log(
            "すでに募集しています"
        );

        return;
    }


    console.log(
        "Socket接続状態:",
        socket.connected
    );

    console.log(
        "currentUser:",
        currentUser
    );

    console.log(
        "myLevel:",
        myLevel
    );


    waiting = true;


    document.getElementById(
        "status"
    ).textContent =
        "ぼしゅうちゅうです（だれかくるとおとがなるのでちゅういしてください）";


    document.getElementById(
        "createBtn"
    ).disabled = true;

    document.getElementById(
        "cancelBtn"
    ).disabled = false;


    const memberOnly =
        currentUser
            ? document.getElementById(
                "memberOnlySelect"
              ).value === "true"
            : false;


    socket.emit(
        "createRoom",
        {
            name:
                currentUser
                    ? currentUser.userId
                    : "ゲスト",

            level:
                currentUser
                    ? currentUser.level
                    : myLevel,

            memberOnly:
                memberOnly
        }
    );
}


function joinRoom(id){

    socket.emit(
        "joinRoom",
        {
            id: id,
            level: myLevel
        }
    );
}


socket.on(
    "startGame",
    room => {

        console.log("★ startGame受信");
        console.log("room:", room);
        console.log("room.hostId:", room.hostId);
        console.log("socket.id:", socket.id);

        const isHost =
            room.hostId === socket.id;

        console.log("isHost:", isHost);

        waiting = false;

        document.getElementById(
            "status"
        ).textContent = "";

        document.getElementById(
            "createBtn"
        ).disabled = false;

        document.getElementById(
            "cancelBtn"
        ).disabled = true;


        // ==============================
        // ホストだけ対戦開始音
        // ==============================

        if (isHost) {

            console.log("★ 音を鳴らします");



            matchSound.play().then(() => {

                console.log("★ 音声再生成功");

            }).catch(error => {

                console.error(
                    "★ 音声再生失敗:",
                    error
                );

            });

        }


        setTimeout(() => {

            location.href =
                `hutari.html?size=${room.size}` +
                `&room=${room.roomId}` +
                `&color=${room.color}` +
                `&maji=true` +
                `&mylv=${room.mylv}` +
                `&enlv=${room.enlv}`;

        }, 800);

    }
);

socket.on(
    "roomList",
    rooms => {

        roomsDiv.innerHTML = "";


        if (rooms.length === 0) {

            roomsDiv.innerHTML =
                "<p>ぼしゅうちゅうのひとはいません。</p>";

            return;
        }


        rooms.forEach(
            room => {

                const div =
                    document.createElement("div");

                div.className = "room";


                let buttonHtml;


                if (
                    room.hostId === socket.id
                ) {

                    buttonHtml =
                        "<b class=\"waiting\">ぼしゅうちゅう</b>";

                } else {

                    buttonHtml =
                        `<button onclick="joinRoom('${room.roomId}')">さんか</button>`;
                }


                let roomInfo;


                if (room.hostMember) {

                    roomInfo = `
                        ${room.name}：
                        レベル ${room.level}
                        ${room.memberOnly ? "【会員のみ】" : ""}
                    `;

                } else {

                    roomInfo = `
                        ${room.name}
                    `;

                }


                div.innerHTML = `
                    <div class="room-content">

                        <span class="room-info">
                            ${roomInfo}
                        </span>

                        <span class="room-button">
                            ${buttonHtml}
                        </span>

                    </div>
                `;


                roomsDiv.appendChild(div);

            }
        );

    }
);


function cancelRoom(){

    if(!waiting) return;


    waiting = false;


    document.getElementById(
        "status"
    ).textContent = "";


    document.getElementById(
        "createBtn"
    ).disabled = false;


    document.getElementById(
        "cancelBtn"
    ).disabled = true;


    socket.emit("cancelRoom");
}

</script>

</body>
</html>
