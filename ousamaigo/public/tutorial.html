<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>おうさまいご　チュートリアル</title>
<link rel="stylesheet" href="css/style.css">
  <style>
#playerImage {
    position: fixed;
    left: 20px;
    bottom: 20px;
    width: 200px;
    z-index: 1000;
}

#speechBubble {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);

    width: 800px;
    height: 300px;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 999;
}

#speechText {
    position: relative;
    z-index: 1;

    font-size: 28px;
    font-weight: bold;
    text-align: center;
}
  </style>
</head>
<body>

<div id="levelInfo" style="display:none;"></div>
<div>
  <span id="turn"></span>
</div>
<div style="position: relative; display: inline-block;">
  <canvas id="goban" width="650" height="650"></canvas>
  <!-- 猫を表示する場所 -->
  <div id="stoneLayer"
       style="
         position: absolute;
         left: 0;
         top: 0;
         width: 650px;
         height: 650px;
         pointer-events: none;
       ">
  </div>
  <div id="effectText"
    style="
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      font-size: 70px;
      font-weight: bold;
      color: black;
      text-align: center;
      pointer-events: none;
      white-space: pre-line;
      background-color: white;
      opacity: 0.8;
      padding: 20px;
      border-radius: 10px;
    ">
  </div>
</div>
<div>
あと<span id="tesuLibs">0</span>て　　
<span id="blackLabel"></span><span id="blackKingLibs"></span> ため<span id="blackTameLibs">0</span>　　
<span id="whiteLabel"></span><span id="whiteKingLibs"></span> ため<span id="whiteTameLibs">1</span>
</div>
<span id="blackTimeLibsDisplay" style="display:none;"></span>
<span id="whiteTimeLibsDisplay" style="display:none;"></span>
<span id="blackTimeLibs" style="display:none;"></span>
<span id="whiteTimeLibs" style="display:none;"></span>
<div class="controls" id="mainControls">
  <button id="pawaBtn">パワーうち</button>
  <button id="oseBtn">リバース</button>
  <button id="passBtn">ためる</button>
<div class="controls" id="mattab" style="display: none;">
  <button id="undoBtn">まった</button>
</div>
  <button id="resetBtn">こうさん</button>
</div>
<div class="controls" id="confirmControls" style="display: none;">
  <button id="cancelBtn">やめる</button>
</div>
<div class="controls" id="saigoControls" style="display: none;">
  <button id="resetBtn2">リセット</button>
</div>

<script>
const SIZE = 6;
const MAJI = false;
const ISNET = false;
const LVDIF = 0;
</script>


<!-- 左下の白猫 -->
<img
  id="playerImage"
  src="bin/ningen.webp"
  style="
    position: fixed;
    left: 20px;
    bottom: 20px;
    width: 400px;
    z-index: 1000;
  "
>

<!-- 下中央の吹き出し -->
<div
  id="speechBubble"
  style="
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    width: 800px;
    height: 300px;
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
  "
>
  <img
    src="cpu/pic/fukidasi.webp"
    style="
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: fill;
      z-index: 0;
    "
  >

  <div
    id="speechText"
    style="
      position: relative;
      z-index: 1;
      font-size: 28px;
      font-weight: bold;
      text-align: center;
    "
  >
    こんにちは！<br/>おうさまいごのせかいへようこそ
  </div>
</div>

<script src="js/state.js"></script>
<script src="js/draw.js"></script>
<script src="js/tutogame.js"></script>
<script src="js/igosyori.js"></script>
<script src="js/tutokugi.js"></script>
<script src="js/init.js"></script>
<script>
gameNow=false;
let enPw=false;
let enRv=false;
let enTa=false;
let enKo=false;

</script>
</body>
</html>
