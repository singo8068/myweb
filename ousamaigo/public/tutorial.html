<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>おうさまいご　チュートリアル</title>
<link rel="stylesheet" href="css/style.css">
  <style>
#playerImage {
    position: fixed;
    left: 20px;
    bottom: 20px;
    width: 200px;
    z-index: 1000;
}

#speechBubble {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);

    width: 800px;
    height: 300px;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 999;
}

#speechText {
    position: relative;
    z-index: 1;

    font-size: 28px;
    font-weight: bold;
    text-align: center;
}
  </style>
</head>
<body>

<div id="levelInfo" style="display:none;"></div>
<div>
  <span id="turn"></span>
</div>
<div style="position: relative; display: inline-block;">

  <canvas id="goban" width="650" height="650"></canvas>

  <!-- 猫を表示する場所 -->
  <div id="stoneLayer"  
       style="  
         position: absolute;  
         left: 0;  
         top: 0;  
         width: 650px;  
         height: 650px;  
         pointer-events: none;  
       ">
  </div>

  <!-- チュートリアルの赤丸 -->
  <div id="tutorialRedCircle"
       style="
         display: none;
         position: absolute;
         width: 110px;
         height: 110px;
         border: 10px solid red;
         border-radius: 50%;

         z-index: 1000;
         pointer-events: none;
         box-sizing: border-box;
       ">
  </div>

  <div id="effectText" 
    style=" 
      display: none; 
      position: absolute; 
      top: 50%; 
      left: 50%; 
      transform: translate(-50%, -50%); 
      width: 80%; 
      font-size: 70px; 
      font-weight: bold; 
      color: black; 
      text-align: center; 
      pointer-events: none; 
      white-space: pre-line; 
      background-color: white; 
      opacity: 0.8; 
      padding: 20px; 
      border-radius: 10px; 
    ">
  </div>

</div>
<div>
あと<span id="tesuLibs">0</span>て　　
<span id="blackLabel"></span><span id="blackKingLibs"></span> ため<span id="blackTameLibs">0</span>　　
<span id="whiteLabel"></span><span id="whiteKingLibs"></span> ため<span id="whiteTameLibs">1</span>
</div>
<span id="blackTimeLibsDisplay" style="display:none;"></span>
<span id="whiteTimeLibsDisplay" style="display:none;"></span>
<span id="blackTimeLibs" style="display:none;"></span>
<span id="whiteTimeLibs" style="display:none;"></span>
<div class="controls" id="mainControls">
  <button id="pawaBtn">パワーうち</button>
  <button id="oseBtn">リバース</button>
  <button id="passBtn">ためる</button>
<div class="controls" id="mattab" style="display: none;">
  <button id="undoBtn">まった</button>
</div>
  <button id="resetBtn">こうさん</button>
</div>
<div class="controls" id="confirmControls" style="display: none;">
  <button id="cancelBtn">やめる</button>
</div>
<div class="controls" id="saigoControls" style="display: none;">
  <button id="resetBtn2">リセット</button>
</div>

<script>
const SIZE = 6;
const MAJI = false;
const ISNET = false;
const LVDIF = 0;
</script>



<img
  id="playerImage"
  src="bin/ningen.webp"
  style="
    position: absolute;
left: calc(50% - 250px);
transform: translateX(-50%)scaleX(-1);
    top: 850px;
    width: 400px;
    z-index: 1000;
  "
>

<!-- 下中央の吹き出し -->
<div
  id="speechBubble"
  style="
    position: absolute;
    top: 850px;
left: calc(50% + 120px);
transform: translateX(-50%);

    width: 600px;
    height: 300px;
    z-index: 999;
  "
>
  <img
    src="cpu/pic/fukidasi.webp"
    style="
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
    "
  >

  <div
    id="speechText"
    style="
      position: relative;
      z-index: 1;
      font-size: 28px;
      font-weight: bold;
      padding: 50px;
    "
  >
    こんにちは！<br/>おうさまいごのせかいへようこそ
  </div>
</div>

<script src="js/state.js"></script>
<script src="js/draw.js"></script>
<script src="js/tutogame.js"></script>
<script src="js/igosyori.js"></script>
<script src="js/tutokugi.js"></script>
<script src="js/init.js"></script>
<script>
gameNow=false;
let enPw=false;
let enRv=false;
let enTa=false;
let enKo=false;

// チュートリアルのセリフ
const thai = [
  ["こんにちは！<br/>おうさまいごのせかいへようこそ", null],
  ["今からこのゲームのルールをせつめいするよ。", null],
  ["まずはくろから、<br/>せんのこうてんにおうさまをだすよ", null],
  ["あかいまるのところを<br/>タップしてみよう", "br",2,2],
  ["つぎに、しろがおうさまをだすよ", null],
  ["そのあとは、ふつうのねこをだしていこう", "wh",2,3, "br",3,3],
  ["いいよ、そんなかんじ", "sm",null],
  ["いいよ、そんなかんじ", "wh",3,2, "br",3,1],
  ["あいてのねこを じょうげさゆうに かこったらとれるよ","ni",null],
  ["あいてのねこを じょうげさゆうに かこったらとれるよ", "wh",2,4, "br",4,2],
  ["ばっちりだね。すでにかこまれてるところは×でひょうじされるよ","go",null],
  ["ばっちりだね。すでにかこまれてるところは×でひょうじされるよ", "wh",1,1, "br",1,2],
  ["くろの×のところはしろはねこをだせないよ","ni",null],
  ["くろの×のところはしろはねこをだせないよ", "wh",0,1, "br",0,2],
  ["くろの×のところはしろはねこをだせないよ",null],
  ["しろの×にはくろはねこをだせないし、あかの×はどちらもねこをだせないよ", "wh",1,0, "br",2,1],
  ["しろの×にはくろはねこをだせないし、あかの×はどちらもねこをだせないよ",null],
  ["しろの×にはくろはねこをだせないし、あかの×はどちらもねこをだせないよ", "wh",3,4, "br",2,0],
  ["しろの×にはくろはねこをだせないし、あかの×はどちらもねこをだせないよ",null],
  ["ためるボタンをおしてパワーをためよう", "wh",4,3,"tm"],
  ["パワーをためるとパワーうちができるよ",null],
  ["パワーをためるとパワーうちができるよ", "wh",1,3,"pw"],
  ["あいてのねこをとれるなら、×のところにもだせるよ", "sm","br",0,0]



];

let ti = 0;


document.addEventListener("click", function () {
    // ゲーム中は、このクリックではセリフを進めない
    if (gameNow) return;
    // 次のセリフへ
    ti++;
    tutoAction();
    // セリフが最後まで行ったら止める
    if (ti >= thai.length) {
        ti = thai.length - 1;
    }
});

function tutoAction() {
    let tj = 1;
    // セリフを表示
    document.getElementById("speechText").innerHTML =
        thai[ti][0];
    // セリフごとの処理
    if (thai[ti][tj] === "sm") {
        document.getElementById("playerImage").src = "bin/hitos.webp"
        tj=tj+1;
    }
    if (thai[ti][tj] === "go") {
        document.getElementById("playerImage").src = "bin/hitog.webp"
        tj=tj+1;
    }
    if (thai[ti][tj] === "ni") {
        document.getElementById("playerImage").src = "bin/ningen.webp"
        tj=tj+1;
    }
    if (thai[ti][tj] === "wh") {
        aiteTutorialGame(thai[ti][tj+1], thai[ti][tj+2]);
        tj=tj+3;
    }
    if (thai[ti][tj] === "br") {
        startTutorialGame(thai[ti][tj+1], thai[ti][tj+2]);
    }
    if (thai[ti][tj] === "tm") {
        gameNow=true;
        enTa=true;
        // 赤い丸を表示
        const circle = document.getElementById("tutorialRedCircle");
        circle.style.display = "block";
        // 赤丸の位置
        circle.style.left = 3.4 * CELL + "px";
        circle.style.top = 6.4 * CELL + "px";
    }
    if (thai[ti][tj] === "pw") {
        gameNow=true;
        enPw=true;
        // 赤い丸を表示
        const circle = document.getElementById("tutorialRedCircle");
        circle.style.display = "block";
        // 赤丸の位置
        circle.style.left = 0.4 * CELL + "px";
        circle.style.top = 6.4 * CELL + "px";
    }
}

</script>
</body>
</html>
