const MAJI = params.get("maji") === "true";
const GAZOU = params.get("gazou");
const KINGE = params.get("kinge");
const MYLV = Number(params.get("mylv"));
const ENLV = Number(params.get("enlv"));
const ISTUYO = Number(params.get("istuyo")) || 2;
const LVDIF = (MYLV === 0 || ENLV === 0)
    ? 0
    : Math.abs(MYLV - ENLV);

let roomId = params.get("room");
let myColor = params.get("color");
const colmoji = myColor === "black" ? "くろ" : "しろ";

const ISNET = !!roomId;

const backMenu = document.getElementById("backMenu");

if (MAJI) {
   document.getElementById("undoBtn").remove();
   document.getElementById("backMenu").remove();
}
