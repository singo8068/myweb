

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>ショップ</title>

<link rel="stylesheet" href="css/style.css">
<style>

body{
    font-family:sans-serif;
    text-align:center;
}

#rooms{
    width:400px;
    margin:auto;
}

.room{
    border:2px solid black;
    border-radius:10px;
    margin:10px;
    padding:10px;
}

input,select{
    font-size:20px;
}

    button:hover {
      background-color: #45a049;
    }
    button {
      display: inline-block;
      margin-top: 0px;
      padding: 0px 10px;
      background-color: #4CAF50;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size:24px;
    }

</style>

</head>

<body>
<div class="section">
  <a href="matiai.html" class="back">まちあいしつにもどる</a>
</div>
<h2>ショップ</h2>

<div id="userStatus"></div>

<div>
    <button id="useGoldenCandyBtn">きんのあめをつかう</button>
</div>
<div>
    <button id="useMagicCandyBtn">まほうのあめをつかう</button>
</div>
<br>
<div>
    <button id="buyGoldenCandyBtn">きんのあめをかう</button>
</div>
<br>
<button id="buyGemBtn">ジェムをかう</button>

<div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();

function getGoldenCandyPrice(level) {

    if (level <= 5) {
        return 150;
    }

    return (level - 2) * 50;
}
// ==============================
// ユーザー情報
// ==============================

async function loadUserInfo() {

    try {

        const response = await fetch("/api/me");

        // ログインしていない
        if (!response.ok) {

            // ゲスト用Cookieを使用
let level = Number(getCookie("level"));
let winDiff = Number(getCookie("winDiff"));

if (!level || Number.isNaN(level)) {
    level = 1;
    document.cookie =
        "level=1; max-age=31536000; path=/";
}

if (Number.isNaN(winDiff)) {
    winDiff = 0;
    document.cookie =
        "winDiff=0; max-age=31536000; path=/";
}

            document.getElementById("userStatus").textContent =
                `ゲスト　レベル ${level}　かちこし ${winDiff}`;

            return;
        }

        // ログインしている場合
        const data = await response.json();

        if (!data.success) {
            throw new Error("ユーザー情報を取得できませんでした");
        }

const user = data.user;

        // Neonから取得した情報を表示
        document.getElementById("userStatus").innerHTML =
            `${user.userId}　レベル ${user.level}　かちこし ${user.winDiff}　　
    <span class="itemInfo">
        <img src="/bin/gyem.webp"> ${user.gems}
        <img src="/bin/kiname.webp"> ${user.goldenCandy}
        <img src="/bin/mahoame.webp"> ${user.magicalCandy}
        <img src="/bin/amekakera.webp"> ${user.candyFragments}
    </span>`;
        console.log("ログインユーザー:", user);

const price = getGoldenCandyPrice(user.level);
document.getElementById("buyGoldenCandyBtn").textContent =
    `きんのあめをかう（${price}ジェム）`;

    } catch (error) {

        console.error("ユーザー情報取得エラー:", error);

        document.getElementById("userStatus").textContent =
            "ユーザー情報を取得できませんでした";
    }
}

// ページを開いたらユーザー情報を取得
loadUserInfo();
document.getElementById("buyGemBtn").addEventListener("click", async () => {

    try {

        const response = await fetch("/api/create-checkout-session", {
            method: "POST"
        });

        const data = await response.json();

        if (data.url) {
            window.location.href = data.url;
        } else {
            alert("決済画面を開けませんでした");
        }

    } catch (error) {

        console.error(error);
        alert("決済画面を開けませんでした");

    }

});
document.getElementById("buyGoldenCandyBtn").addEventListener("click", async () => {

    try {

        const response = await fetch("/api/buy-golden-candy", {
            method: "POST"
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            alert(data.message || "購入できませんでした");
            return;
        }

        alert("きんのあめを1個購入しました！");

        // 購入後にジェム・アイテム数を更新
        loadUserInfo();

    } catch (error) {

        console.error(error);
        alert("購入処理でエラーが発生しました");

    }

});

document.getElementById("useGoldenCandyBtn").addEventListener("click", () => {
    useCandy("golden");
});

document.getElementById("useMagicCandyBtn").addEventListener("click", () => {
    useCandy("magic");
});

async function useCandy(type) {

    try {

        const response = await fetch("/api/use-candy", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                type: type
            })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            alert(data.message || "あめを使えませんでした");
            return;
        }

        if (type === "golden") {
            alert("きんのあめを1個使いました！");
        } else if (type === "magic") {
            alert("まほうのあめを1個使いました！");
        }

        loadUserInfo();

    } catch (error) {

        console.error(error);
        alert("あめの使用処理に失敗しました");

    }
}

</script>

</body>
</html>
